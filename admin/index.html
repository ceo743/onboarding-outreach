<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --paper:#efece3;
  --paper-raised:#fbf9f4;
  --paper-sunken:#e7e3d8;
  --ink:#1b1d19;
  --ink-soft:#5d6157;
  --ink-faint:#696b67;
  --line:#dcd7c9;
  --line-soft:#e7e3d8;
  --accent:#2d5c4d;
  --accent-ink:#1f4438;
  --accent-soft:#dfeae4;
  --warn:#9c5323;
  --warn-soft:#f2e4d6;
  --focus:#2d5c4d;
  --ombra: 0 1px 2px rgba(27,29,25,.04), 0 12px 32px -18px rgba(27,29,25,.28);
  --ombra-alta: 0 2px 4px rgba(27,29,25,.05), 0 30px 60px -30px rgba(27,29,25,.35);
  --backdrop: rgba(20,22,19,.55);
  --curva: cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111310;
    --paper-raised:#191c18;
    --paper-sunken:#0d0f0c;
    --ink:#ece9df;
    --ink-soft:#9ba193;
    --ink-faint:#797f77;
    --line:#2c3029;
    --line-soft:#232720;
    --accent:#86b8a3;
    --accent-ink:#a9d3c3;
    --accent-soft:#1d2a24;
    --warn:#d99a63;
    --warn-soft:#33251a;
    --focus:#86b8a3;
    --ombra: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -20px rgba(0,0,0,.7);
    --ombra-alta: 0 2px 6px rgba(0,0,0,.5), 0 40px 80px -30px rgba(0,0,0,.85);
    --backdrop: rgba(6,8,6,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#111310; --paper-raised:#191c18; --paper-sunken:#0d0f0c;
  --ink:#ece9df; --ink-soft:#9ba193; --ink-faint:#797f77;
  --line:#2c3029; --line-soft:#232720;
  --accent:#86b8a3; --accent-ink:#a9d3c3; --accent-soft:#1d2a24;
  --warn:#d99a63; --warn-soft:#33251a; --focus:#86b8a3;
  --ombra: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -20px rgba(0,0,0,.7);
  --ombra-alta: 0 2px 6px rgba(0,0,0,.5), 0 40px 80px -30px rgba(0,0,0,.85);
  --backdrop: rgba(6,8,6,.7);
}
:root[data-theme="light"]{
  --paper:#efece3; --paper-raised:#fbf9f4; --paper-sunken:#e7e3d8;
  --ink:#1b1d19; --ink-soft:#5d6157; --ink-faint:#696b67;
  --line:#dcd7c9; --line-soft:#e7e3d8;
  --accent:#2d5c4d; --accent-ink:#1f4438; --accent-soft:#dfeae4;
  --warn:#9c5323; --warn-soft:#f2e4d6; --focus:#2d5c4d;
  --backdrop: rgba(20,22,19,.55);
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);min-height:100vh;
  font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;}
.wrap{max-width:760px;margin:0 auto;padding:48px 20px 80px;}
h1{font-family:Fraunces,Georgia,serif;font-size:30px;font-weight:600;margin:0 0 8px;letter-spacing:-.015em;line-height:1.15}
.kicker{font-family:inherit;font-size:12.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px}
p.sub{color:var(--ink-soft);font-size:17px;line-height:1.55;margin:0 0 26px}
.card{background:var(--paper-raised);border:1px solid var(--line-soft);border-radius:24px;
  padding:30px;margin:0 8px 30px;box-shadow:0 0 0 8px var(--paper-sunken),0 0 0 9px var(--line),var(--ombra)}
label{display:block;font-family:inherit;font-size:14px;
  color:var(--ink-soft);margin:0 0 6px}
input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:16px;
  background:var(--paper);color:var(--ink);font-size:16px;font-family:inherit;
  margin-bottom:16px}
textarea{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:16px;
  background:var(--paper);color:var(--ink);font-size:15.5px;line-height:1.5;
  font-family:inherit;margin-bottom:16px;resize:vertical}
textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px var(--accent-soft)}
input:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px var(--accent-soft)}
button{width:100%;padding:15px;border:0;border-radius:99px;background:var(--accent);
  color:var(--paper-raised);font-size:16px;font-weight:600;cursor:pointer;
  font-family:ui-sans-serif,system-ui,sans-serif}
button:hover{filter:brightness(1.06)}
a.bottone{display:inline-block;padding:9px 16px;border-radius:99px;border:1px solid var(--line);
  color:var(--ink-soft);text-decoration:none;font-family:inherit;
  font-size:13.5px;font-weight:500;background:transparent}
a.bottone:hover{color:var(--accent);border-color:var(--accent)}
button.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);font-weight:500}
.msg{font-family:inherit;font-size:15px;margin:0 0 14px;min-height:1.2em}
.msg.err{color:var(--warn)}
.msg.ok{color:var(--accent)}
.riga{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
.riga:last-child{border-bottom:0}
.riga .chi{font-weight:600}
.riga .link{font-family:inherit;font-size:13.5px}
.tag{font-family:inherit;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--warn);border:1px solid var(--warn);border-radius:999px;
  padding:1px 8px;font-weight:600;vertical-align:middle}
button.mini{width:auto;padding:8px 15px;font-size:12.5px;background:transparent;color:var(--ink-soft);
  border:1px solid var(--line);font-weight:600;border-radius:99px}
button.mini:hover{color:var(--accent);border-color:var(--accent);filter:none}
button.mini.rischio:hover{color:var(--warn);border-color:var(--warn)}
a{color:var(--accent)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;
  font-family:inherit;font-size:14px;color:var(--ink-soft)}
.topbar button{width:auto;padding:8px 14px;font-size:13.5px}
.nota{font-family:inherit;font-size:13.5px;color:var(--ink-soft);
  line-height:1.5;margin:14px 0 0}
#elenco details{border-bottom:1px solid var(--line)}
#elenco details:last-child{border-bottom:0}
#elenco summary{
  display:grid; grid-template-columns:14px minmax(0,1fr) auto; gap:12px;
  align-items:center; padding:14px 2px; cursor:pointer; list-style:none;
}
#elenco summary::-webkit-details-marker{display:none}
#elenco summary:hover{background:color-mix(in srgb, var(--ink) 3%, transparent)}
.freccia{
  width:0;height:0;border-left:5px solid var(--ink-soft);
  border-top:4px solid transparent;border-bottom:4px solid transparent;
  transition:transform .12s ease; margin-left:4px;
}
#elenco details[open] .freccia{transform:rotate(90deg)}
#elenco summary .testo{min-width:0;display:flex;flex-direction:column;gap:3px}
#elenco summary .riga1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
#elenco summary .chi{font-size:16.5px;font-weight:600;font-family:ui-sans-serif,system-ui,sans-serif}
#elenco summary .stato{font-family:inherit;font-size:12.5px;color:var(--ink-soft)}
#elenco summary .riga2{
  font-family:inherit;font-size:12.5px;color:var(--ink-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#elenco summary .azioni{display:flex;align-items:center;gap:8px;margin-left:auto}
@media (max-width:620px){
  #elenco summary{grid-template-columns:14px minmax(0,1fr); row-gap:10px}
  #elenco summary .azioni{grid-column:2;justify-content:flex-start}
}
.qa{margin:14px 0 4px}
.qa .dom{font-family:inherit;font-size:13.5px;
  color:var(--ink-soft);margin:0 0 3px}
.qa .ris{margin:0 0 14px;font-size:16.5px;line-height:1.5;white-space:pre-wrap}
.qa .vuota{color:var(--ink-soft);font-style:italic}
.qa .bozza{display:block;font-family:inherit;font-size:12px;
  letter-spacing:.04em;text-transform:uppercase;color:var(--warn);margin-bottom:4px}
/* blocco facoltativo, file, avanzamento */
.piu{ border:1px solid var(--line-soft); border-radius:18px; background:var(--paper); margin:4px 0 20px; }
.piu>summary{
  list-style:none; cursor:pointer; padding:14px 18px; font-size:14px; font-weight:600;
  color:var(--ink-soft); display:flex; align-items:center; gap:10px;
}
.piu>summary::-webkit-details-marker{display:none}
.piu>summary::before{ content:"+"; font-size:16px; color:var(--ink-faint); }
.piu[open]>summary::before{ content:"−"; }
.piu>summary:hover{ color:var(--ink); }
.piu .dentro{ padding:4px 18px 18px; }
.file-riga{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:-6px 0 18px; }
.file-btn{
  display:inline-flex; align-items:center; gap:9px; padding:11px 18px; border-radius:99px;
  border:1px dashed var(--line); color:var(--ink-soft); font-size:14px; font-weight:600; cursor:pointer;
  transition:border-color .45s var(--curva), color .45s var(--curva), background .45s var(--curva);
}
.file-btn:hover{ border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft); }
.file-riga input[type=file]{ display:none; }
.file-riga .esito{ font-size:13px; color:var(--ink-faint); }
.avanzamento{ display:flex; align-items:center; gap:11px; font-size:14.5px; color:var(--ink-soft); }
.rotella{
  width:16px; height:16px; border-radius:50%; border:2px solid var(--line);
  border-top-color:var(--accent); animation:gira .8s linear infinite; flex:none;
}
@keyframes gira{ to{ transform:rotate(360deg); } }
[hidden]{display:none!important}
</style>

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function slugify(nome){
  return nome.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}

function schedaVuota(slug, nome, brand){
  return {
    slug, nome, brand: brand || nome, email_autorizzate: [],
    aggiornato: new Date().toISOString().replace(/\.\d{3}Z$/,'Z'),
    kpi:{ inviti_totali:0, accettati:0, tasso_accettazione_maturi:null,

      tasso_risposta:null, risposte_positive:0, call_fissate:0, referral:0 },
    funnel:[{fase:'Inviti',v:0},{fase:'Accettati',v:0},{fase:'Contattati',v:0},
      {fase:'Risposte',v:0},{fase:'Call',v:0}],
    serie_giornaliera:[], registro_risposte:[], log:[]
  };
}

// --- schermata: accesso -------------------------------------------------
function vistaLogin(errore){
  app.innerHTML = `
    <p class="kicker">DC Academy</p>
    <h1>Pannello clienti</h1>
    <p class="sub">Riservato al team. Entra con la tua email di lavoro.</p>
    <div class="card">
      <p class="msg err" id="msg">${esc(errore || '')}</p>
      <label for="em">Email</label>
      <input id="em" type="email" autocomplete="username" placeholder="nome@davidecaiazzo.it">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password">
      <button id="go">Entra</button>
      <p class="nota">Password dimenticata o primo accesso?
        <a href="#" id="reset">Ricevi il link per impostarla</a> sulla tua email di lavoro.</p>
    </div>`;
  const entra = () => {
    const em = document.getElementById('em').value.trim().toLowerCase();
    const pw = document.getElementById('pw').value;
    if (!em || !pw) { document.getElementById('msg').textContent = 'Scrivi email e password.'; return; }
    document.getElementById('msg').textContent = 'Un attimo…';
    auth.signInWithEmailAndPassword(em, pw).catch(e => {
      const m = { 'auth/wrong-password':'Password sbagliata.', 'auth/user-not-found':'Email non riconosciuta.',
        'auth/invalid-credential':'Email o password sbagliate.', 'auth/too-many-requests':'Troppi tentativi, riprova fra qualche minuto.' };
      document.getElementById('msg').textContent = m[e.code] || ('Non riesco a farti entrare: ' + e.message);
    });
  };
  document.getElementById('go').onclick = entra;
  document.getElementById('pw').onkeydown = e => { if (e.key === 'Enter') entra(); };
  document.getElementById('reset').onclick = (ev) => {
    ev.preventDefault();
    const msg = document.getElementById('msg');
    const em = document.getElementById('em').value.trim().toLowerCase();
    if (!em) { msg.className = 'msg err'; msg.textContent = "Scrivi prima la tua email qui sopra."; return; }
    msg.className = 'msg'; msg.textContent = 'Mando il link…';
    auth.sendPasswordResetEmail(em).then(() => {
      msg.className = 'msg ok';
      msg.textContent = 'Fatto: controlla la tua casella, dentro c\'è il link per scegliere la password.';
    }).catch(e => {
      msg.className = 'msg err';
      msg.textContent = e.code === 'auth/user-not-found'
        ? "Questa email non è abilitata al pannello."
        : 'Non sono riuscito a mandarlo: ' + e.message;
    });
  };
}

// --- schermata: cambio password al primo accesso ------------------------
function vistaCambioPassword(user){
  app.innerHTML = `
    <p class="kicker">Primo accesso</p>
    <h1>Scegli la tua password</h1>
    <p class="sub">Quella che ti abbiamo dato la sa anche chi te l'ha mandata. Scegline una tua, la conoscerai solo tu.</p>
    <div class="card">
      <p class="msg err" id="msg"></p>
      <label for="p1">Nuova password (almeno 10 caratteri)</label>
      <input id="p1" type="password" autocomplete="new-password">
      <label for="p2">Riscrivila</label>
      <input id="p2" type="password" autocomplete="new-password">
      <button id="go">Salva ed entra</button>
    </div>`;
  document.getElementById('go').onclick = () => {
    const p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
    const msg = document.getElementById('msg');
    if (p1.length < 10) { msg.textContent = 'Troppo corta: almeno 10 caratteri.'; return; }
    if (p1 !== p2) { msg.textContent = 'Le due password non sono uguali.'; return; }
    msg.textContent = 'Salvo…';
    user.updatePassword(p1)
      .then(() => avvia(user, true))
      .catch(e => { msg.textContent = 'Non sono riuscito a salvarla: ' + e.message; });
  };
}

// --- schermata: pannello ------------------------------------------------
function vistaPannello(user){
  app.innerHTML = `
    <div class="topbar">
      <span>${esc(user.email)}</span>
      <span style="display:flex;gap:10px;align-items:center">
        <a class="ghost bottone" href="../?anteprima=1" target="_blank" rel="noopener">Guarda il questionario modello</a>
        <button class="ghost" id="esci">Esci</button>
      </span>
    </div>
    <p class="kicker">DC Academy</p>
    <h1>Aggiungi nuovo cliente</h1>
    <p class="sub">Servono solo la sua email e la trascrizione della call. Il resto lo ricaviamo noi.</p>
    <div class="card">
      <p class="msg" id="msg"></p>
      <label for="email">Email del cliente <span style="color:var(--warn)">*</span></label>
      <input id="email" type="email" placeholder="mario@azienda.it" required autocomplete="off">

      <label for="trascrizione">Trascrizione della call</label>
      <textarea id="trascrizione" rows="8" placeholder="Incolla qui la trascrizione della call."></textarea>
      <div class="file-riga">
        <label class="file-btn" for="file">Carica un file di testo
          <input type="file" id="file" accept=".txt,.md,.text,.vtt,.srt"></label>
        <span class="esito" id="filestato">Word e PDF non si leggono da qui: aprili e incolla il testo sopra.</span>
      </div>

      <details class="piu">
        <summary>Aggiungi nome, azienda e fonti (facoltativo)</summary>
        <div class="dentro">
          <label for="nome">Nome e cognome</label>
          <input id="nome" placeholder="Lo ricaviamo dalla call se lo lasci vuoto">
          <label for="brand">Azienda</label>
          <input id="brand" placeholder="Rossi Costruzioni">
          <label for="fonti">Sito e profilo LinkedIn</label>
          <input id="fonti" placeholder="rossicostruzioni.it, linkedin.com/in/mariorossi">
        </div>
      </details>

      <button id="crea">Crea il cliente</button>
      <p class="nota">Appena premi: leggiamo la call, scriviamo le sue risposte e parte l'email da
        academy@davidecaiazzo.it col link per rispondere, in copia Chiara, Roberta e Davide.
        Ci vuole circa un minuto. La dashboard nasce da sola quando il cliente ha finito.</p>
    </div>
    <div class="card">
      <h1 style="font-size:19px;margin-bottom:6px">Clienti</h1>
      <p class="nota" style="margin:0 0 10px">Apri un cliente per leggere il suo questionario.</p>

}

function elencoTutto(){
  Promise.all([
    db.collection('clienti').get(),
    db.collection('onboarding_wizard').get().catch(() => null)
  ]).then(([clienti, wizard]) => {
    const box = document.getElementById('elenco');
    if (!box) return;
    const mappa = {};
    clienti.forEach(d => {
      const c = d.data();
      if (c.eliminato) return;
      mappa[d.id] = { slug:d.id, nome:c.nome || d.id, emails:(c.email_autorizzate || []),
        sospeso:!!c.sospeso, scheda:true };
    });
    if (wizard) wizard.forEach(d => {
      const w = d.data();
      if (w.eliminato) { delete mappa[d.id]; return; }
      let stato = {};
      try { stato = JSON.parse(w.stato_json || '{}'); } catch(e) {}
      const risposte = stato.answers || {};
      const voce = mappa[d.id] || { slug:d.id, nome:w.cliente || d.id, emails:w.email ? [w.email] : [],
        sospeso:false, scheda:false };
      voce.confermato = stato.submitted === true;
      voce.nRisposte = Object.keys(risposte).filter(k => String(risposte[k] || '').trim()).length;
      voce.preparazione = w.stato_preparazione || null;
      voce.questionario = true;
      mappa[d.id] = voce;
    });

    const voci = Object.values(mappa).sort((a, b) => a.nome.localeCompare(b.nome));
    if (!voci.length) { box.innerHTML = '<p class="nota">Ancora nessuno.</p>'; return; }

    box.innerHTML = voci.map(v => {
      let stato;
      if (v.preparazione === 'da_preparare') stato = 'domande in preparazione';
      else if (v.preparazione === 'pronta' && !v.confermato && !v.nRisposte) stato = 'link mandato, in attesa che risponda';
      else if (v.confermato) stato = `questionario confermato · ${v.nRisposte} risposte`;
      else if (v.questionario) stato = `questionario da compilare · ${v.nRisposte} risposte`;
      else stato = 'nessun questionario';
      return `<details data-slug="${esc(v.slug)}">
        <summary>
          <span class="freccia" aria-hidden="true"></span>
          <span class="testo">
            <span class="riga1">
              <span class="chi">${esc(v.nome)}</span>
              ${v.sospeso ? '<span class="tag">sospeso</span>' : ''}
              <span class="stato">${stato}</span>
            </span>
            <span class="riga2">${esc(v.emails.join(' · ') || 'nessuna email')}</span>
          </span>
          <span class="azioni">
            ${v.scheda ? `<button class="mini" data-azione="${v.sospeso ? 'riattiva' : 'sospendi'}" data-slug="${esc(v.slug)}">${v.sospeso ? 'Riattiva' : 'Sospendi'}</button>` : ''}
            <button class="mini rischio" data-azione="elimina" data-slug="${esc(v.slug)}">Elimina</button>
          </span>
        </summary>
        ${v.questionario ? `<div class="qa" data-box="${esc(v.slug)}"><p class="nota">Apro…</p></div>`
          : '<p class="nota" style="margin:12px 0 0">Questionario non ancora creato.</p>'}
      </details>`;
    }).join('');

    box.querySelectorAll('details').forEach(det => {
      det.addEventListener('toggle', () => { if (det.open) mostraRisposte(det.dataset.slug); });
    });
    box.querySelectorAll('button[data-azione]').forEach(b => {
      b.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); azioneCliente(b.dataset.azione, b.dataset.slug); };
    });
  }).catch(e => {
    const box = document.getElementById('elenco');
    if (box) box.innerHTML = `<p class="nota">Non riesco a leggere l'elenco: ${esc(e.message)}</p>`;
  });
}

function mostraRisposte(slug){
  const box = document.querySelector(`[data-box="${slug}"]`);
  if (!box || box.dataset.fatto) return;
  box.dataset.fatto = '1';
  Promise.all([
    db.collection('onboarding_wizard').doc(slug).get(),
    caricaDomande()
  ]).then(([snap, domande]) => {
    const dati = snap.data() || {};
    let stato = {};
    try { stato = JSON.parse(dati.stato_json || '{}'); } catch(e) {}
    const risposte = stato.answers || {};
    const saltate = stato.skipped || {};
    const bozze = dati.bozze || {};
    if (dati.stato_preparazione === 'da_preparare' && !Object.keys(domande).length) {
      box.innerHTML = '<p class="nota">Stiamo preparando il questionario da quello che ha detto in call. Appena è pronto compare qui col link da mandargli.</p>';
      return;
    }
    const chiavi = Object.keys(domande).length
      ? Object.keys(domande)
      : Object.keys(Object.assign({}, bozze, risposte));
    const righe = chiavi.map(k => {
      const q = domande[k] || { testo:k };
      const r = String(risposte[k] || '').trim();
      let corpo;
      if (r) corpo = esc(r);
      else if (String(bozze[k] || '').trim()) corpo = `<span class="bozza">bozza scritta da noi, il cliente non l'ha ancora confermata</span>${esc(bozze[k])}`;
      else corpo = `<span class="vuota">${saltate[k] ? 'saltata dal cliente' : 'non ancora risposta'}</span>`;
      return `<p class="dom">${esc(q.testo)}</p><p class="ris">${corpo}</p>`;
    });
    const link = `<p class="nota" style="margin:0 0 16px">Link del questionario:
      <a href="../?c=${esc(slug)}" target="_blank" rel="noopener">onboarding.davidecaiazzo.it/?c=${esc(slug)}</a></p>`;
    box.innerHTML = (Object.keys(domande).length ? link : '') + (righe.length ? righe.join('') : '<p class="nota">Nessuna risposta.</p>');
  }).catch(e => { box.innerHTML = `<p class="nota">Non riesco a leggerle: ${esc(e.message)}</p>`; });
}

// Sospendi = ferma tutto per quel cliente (outreach, aggiornamento numeri) ma non tocca niente.
// Elimina = gli toglie l'accesso e lo nasconde; i dati restano in archivio, si può recuperare.
// Il questionario non si puo' cancellare (le regole lo vietano): lo marchiamo eliminato e sparisce.
function nascondiQuestionario(slug){
  return db.collection('onboarding_wizard').doc(slug).get().then(w => {
    if (!w.exists) return null;
    const d = w.data();
    return db.collection('onboarding_wizard').doc(slug).set({
      cliente: d.cliente || slug, slug: slug, stato_json: d.stato_json || '{}',
      eliminato: true, eliminato_il: new Date().toISOString()
    }, { merge: true });
  }).catch(() => null);
}

// Sospensioni/eliminazioni sono azioni invasive: Davide vuole sempre saperlo, con chi le
// ha fatte, su chi, e cosa e' successo (richiesta 03/09/2026). Se l'invio fallisce non
// blocca l'azione (e' gia' successa): resta solo un avviso in console, mai un dato perso.
function avvisaAzioneInvasiva(azione, cliente, slug, dettagli){
  auth.currentUser.getIdToken().then(idToken => fetch(MOTORE_NOTIFICA, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id_token: idToken, azione, cliente, slug, dettagli: dettagli || '' }),
  })).catch(e => console.warn('notifica azione non inviata:', e));
}

function azioneCliente(azione, slug){
  const ref = db.collection('clienti').doc(slug);
  ref.get().then(snap => {
    const c = snap.exists ? snap.data() : {};
    const chi = c.nome || slug;
    if (!snap.exists && azione !== 'elimina') return;

    if (azione === 'sospendi') {
      if (!confirm(`Sospendere ${chi}?\n\nSi fermano il suo outreach e l'aggiornamento dei suoi numeri. Nessun dato viene perso e puoi riattivarlo quando vuoi.`)) return;
      return ref.update({ sospeso: true, sospeso_il: new Date().toISOString() })
        .then(() => avvisaAzioneInvasiva('sospeso', chi, slug));
    }
    if (azione === 'riattiva') {
      return ref.update({ sospeso: false, riattivato_il: new Date().toISOString() })
        .then(() => avvisaAzioneInvasiva('riattivato', chi, slug));
    }
    if (azione === 'elimina') {
      if (!confirm(`Eliminare ${chi}?\n\nPerde l'accesso alla dashboard e sparisce da questo elenco. I suoi dati restano in archivio, quindi si può recuperare.`)) return;
      if (prompt('Per confermare scrivi ELIMINA') !== 'ELIMINA') return;
      const emails = (c.email_autorizzate || []).map(e => String(e).toLowerCase());
      return Promise.all(emails.map(e => db.collection('accessi').doc(e).delete().catch(() => {})))
        .then(() => snap.exists ? ref.update({
          eliminato: true, eliminato_il: new Date().toISOString(),
          sospeso: true, email_autorizzate: [], email_prima_di_eliminare: emails
        }) : null)
        .then(() => nascondiQuestionario(slug))
        .then(() => avvisaAzioneInvasiva('eliminato', chi, slug, emails.length ? `accessi rimossi: ${emails.join(', ')}` : ''));
    }
  }).then(() => { elencoTutto(); })
    .catch(e => alert("Non ce l'ho fatta: " + e.message));
}

// --- questionari di onboarding ------------------------------------------
// Le risposte stanno in onboarding_wizard/{slug}; i testi delle domande stanno
// nella pagina del cliente, quindi la leggiamo e ne estraiamo le coppie id/domanda.
const testiDomande = {};

function ripulisci(t){
  return String(t).replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\\\/g, '\\');
}

// I testi delle domande stanno nella pagina unica del questionario: la leggiamo una volta
// sola e la teniamo da parte. Le bozze scritte dal motore stanno su Firestore (campo bozze).
let cacheDomande = null;
function caricaDomande(){
  if (cacheDomande) return Promise.resolve(cacheDomande);
  return fetch('../?anteprima=1').then(r => r.ok ? r.text() : '').then(html => {
    const mappa = {};
    const reId = /id:\s*"([^"]+)"/g;
    const punti = [];
    let m;
    while ((m = reId.exec(html))) punti.push({ id: m[1], da: m.index });
    punti.forEach((p, k) => {
      const fine = k + 1 < punti.length ? punti[k + 1].da : Math.min(html.length, p.da + 2500);
      const t = /text:\s*"((?:[^"\\]|\\.)*)"/.exec(html.slice(p.da, fine));
      if (t) mappa[p.id] = { testo: ripulisci(t[1]) };
    });
    if (Object.keys(mappa).length) cacheDomande = mappa;
    return mappa;
  }).catch(() => ({}));
}

// Il motore lavora in sottofondo: qui seguiamo lo stato su Firestore e lo raccontiamo,
// invece di lasciare il pulsante fermo per un minuto come se fosse rotto.
function seguiPreparazione(slug, nome, link){
  const msg = document.getElementById('msg');
  const url = 'https://firestore.googleapis.com/v1/projects/dc-outreach-dashboard/databases/(default)/documents/onboarding_wizard/' + slug;
  const inizio = Date.now();
  msg.className = 'msg';
  msg.innerHTML = '<span class="avanzamento"><span class="rotella"></span>Sto leggendo la call e scrivendo le sue risposte…</span>';

  return new Promise(resolve => {
    const battito = setInterval(() => {
      fetch(url + '?t=' + Date.now()).then(r => r.ok ? r.json() : null).then(doc => {
        const f = (doc && doc.fields) || {};
        const stato = f.stato_preparazione && f.stato_preparazione.stringValue;
        const errore = f.errore && f.errore.stringValue;
        const erroreMail = f.errore_email && f.errore_email.stringValue;
        const inviata = !!(f.email_inviata_il && f.email_inviata_il.stringValue);
        const quante = f.bozze && f.bozze.mapValue ? Object.keys(f.bozze.mapValue.fields || {}).length : 0;

        if (stato === 'errore') {
          clearInterval(battito);
          msg.className = 'msg err';
          msg.textContent = 'La preparazione si è fermata: ' + (errore || 'errore sconosciuto');
          return resolve();
        }
        if (stato === 'pronta') {
          clearInterval(battito);
          msg.className = 'msg ok';
          // Preferisci sempre il nome scritto dal motore (letto per davvero dalla call):
          // se il campo era stato lasciato vuoto, e' l'unico nome corretto che esiste.
          const nomeReale = (f.cliente && f.cliente.stringValue) || nome;
          msg.innerHTML = `<strong>${esc(nomeReale)}</strong> è pronto: ${quante} risposte già scritte dalla call.<br>
            ${inviata
              ? 'Email partita da academy@davidecaiazzo.it, in copia Chiara, Roberta e Davide.'
              : '<span style="color:var(--warn)">Email non partita' + (erroreMail ? ' (' + esc(erroreMail) + ')' : '') + '. Il questionario è pronto: mandagli tu il link.</span>'}<br>
            Questionario: <a href="${esc(link)}" target="_blank" rel="noopener">${esc(link)}</a><br>
            La dashboard nasce da sola quando ha finito di rispondere.`;
          elencoTutto();
          return resolve();
        }
        if (Date.now() - inizio > 240000) {
          clearInterval(battito);
          msg.className = 'msg err';
          msg.textContent = 'Ci sta mettendo troppo. Ricarica fra un minuto: se il questionario è pronto lo vedi qui sotto.';
          return resolve();
        }
      }).catch(() => {});
    }, 3000);
  });
}

function creaCliente(user){
  const msg = document.getElementById('msg');
  const email = document.getElementById('email').value.trim().toLowerCase();
  const trascrizione = document.getElementById('trascrizione').value.trim();
  const nome = document.getElementById('nome').value.trim();
  const brand = document.getElementById('brand').value.trim();
  const fonti = document.getElementById('fonti').value.trim();
  msg.className = 'msg err';
  if (!email) { msg.textContent = "L'email del cliente è obbligatoria."; document.getElementById('email').focus(); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg.textContent = "L'email non sembra valida."; document.getElementById('email').focus(); return; }
  if (trascrizione.length < 200) { msg.textContent = 'Incolla la trascrizione della call (o carica il file).'; return; }

  const stimaSlug = email.split('@')[0].replace(/[._]+/g, ' ');
  const slug = slugify(nome || stimaSlug);
  if (!slug) { msg.textContent = 'Non riesco a ricavare un nome: scrivilo nella parte facoltativa.'; return; }
  // Il nome mostrato viene SOLO da quanto scritto qui o da quanto il motore legge nella
  // trascrizione: mai indovinato dall'indirizzo email (dava nomi rotti tipo "D Avidecaiazzo"
  // per email come d.rossi@... — e quel nome indovinato, se spedito al motore come fosse
  // vero, gli toglieva ogni motivo per ricavarlo davvero dalla call).
  const nomeVisibile = nome || null;
  const nomeInAttesa = nome || 'Il cliente';

  msg.className = 'msg'; msg.textContent = 'Salvo la richiesta…';
  db.collection('onboarding_wizard').doc(slug).set({
    cliente: nomeVisibile,
    slug: slug,
    email: email,
    brand: brand,
    fonti: fonti,
    stato_json: JSON.stringify({ stage:'gate', i:0, answers:{}, skipped:{}, returnToRecap:false, submitted:false, updatedAt: Date.now() }),
    updatedAt: Date.now(),
    trascrizione: trascrizione,
    stato_preparazione: 'da_preparare',
    eliminato: false,
    richiesto_il: new Date().toISOString(),
    richiesto_da: user.email
  }, { merge: true }).then(() => {
    msg.textContent = (nomeVisibile ? '' : nomeInAttesa + ': ') + 'sto leggendo la call e scrivendo le sue domande… un minuto.';
    return user.getIdToken().then(idToken => fetch(MOTORE, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id_token: idToken, slug, cliente: nomeVisibile, email,
                             brand, fonti, trascrizione })
    })).then(r => r.json().then(d => ({ ok: r.ok, d })));
  }).then(({ ok, d }) => {
    if (!ok || !d.ok) throw new Error((d && d.errore) || 'il motore non ha risposto');
    return seguiPreparazione(slug, nomeVisibile || nomeInAttesa, d.link);
  }).then(() => {
    ['email','trascrizione','nome','brand','fonti'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    const fs = document.getElementById('filestato'); if (fs) fs.textContent = '';
    elencoTutto();
  }).catch(e => {
    msg.className = 'msg err';
    msg.textContent = "Non ce l'ho fatta: " + e.message;
  });
}

// --- avvio --------------------------------------------------------------
function avvia(user, passwordAppenaCambiata){
  if (passwordAppenaCambiata) { vistaPannello(user); return; }
  // primo accesso = password mai cambiata da quando l'account è stato creato
  user.getIdToken().then(idToken =>
    fetch(`https://identitytoolkit.googleapis.com/v1/accounts:lookup?key=${FIREBASE_CONFIG.apiKey}`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ idToken })
    }).then(r => r.json())
  ).then(d => {
    const u = (d.users || [])[0] || {};
    const creato = Number(u.createdAt || 0), cambiata = Number(u.passwordUpdatedAt || 0);
    if (creato && cambiata && Math.abs(cambiata - creato) < 120000) vistaCambioPassword(user);
    else vistaPannello(user);
  }).catch(() => vistaPannello(user));
}

auth.onAuthStateChanged(user => { user ? avvia(user, false) : vistaLogin(); });
