<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding · DC Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#efece3">
<style>
/* ── Sistema visivo · onboarding DC Academy ───────────────────────────────
   Carta calda, serif editoriale, un solo accento verde. Ogni scheda e' una
   lastra dentro un vassoio (doppio bordo), il movimento ha peso. */
:root{
  --paper:#efece3;
  --paper-raised:#fbf9f4;
  --paper-sunken:#e7e3d8;
  --ink:#1b1d19;
  --ink-soft:#5d6157;
  --ink-faint:#696b67;
  --line:#dcd7c9;
  --line-soft:#e7e3d8;
  --accent:#2d5c4d;
  --accent-ink:#1f4438;
  --accent-soft:#dfeae4;
  --warn:#9c5323;
  --warn-soft:#f2e4d6;
  --focus:#2d5c4d;
  --ombra: 0 1px 2px rgba(27,29,25,.04), 0 12px 32px -18px rgba(27,29,25,.28);
  --ombra-alta: 0 2px 4px rgba(27,29,25,.05), 0 30px 60px -30px rgba(27,29,25,.35);
  --backdrop: rgba(20,22,19,.55);
  --curva: cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111310;
    --paper-raised:#191c18;
    --paper-sunken:#0d0f0c;
    --ink:#ece9df;
    --ink-soft:#9ba193;
    --ink-faint:#797f77;
    --line:#2c3029;
    --line-soft:#232720;
    --accent:#86b8a3;
    --accent-ink:#a9d3c3;
    --accent-soft:#1d2a24;
    --warn:#d99a63;
    --warn-soft:#33251a;
    --focus:#86b8a3;
    --ombra: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -20px rgba(0,0,0,.7);
    --ombra-alta: 0 2px 6px rgba(0,0,0,.5), 0 40px 80px -30px rgba(0,0,0,.85);
    --backdrop: rgba(6,8,6,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#111310; --paper-raised:#191c18; --paper-sunken:#0d0f0c;
  --ink:#ece9df; --ink-soft:#9ba193; --ink-faint:#797f77;
  --line:#2c3029; --line-soft:#232720;
  --accent:#86b8a3; --accent-ink:#a9d3c3; --accent-soft:#1d2a24;
  --warn:#d99a63; --warn-soft:#33251a; --focus:#86b8a3;
  --ombra: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -20px rgba(0,0,0,.7);
  --ombra-alta: 0 2px 6px rgba(0,0,0,.5), 0 40px 80px -30px rgba(0,0,0,.85);
  --backdrop: rgba(6,8,6,.7);
}
:root[data-theme="light"]{
  --paper:#efece3; --paper-raised:#fbf9f4; --paper-sunken:#e7e3d8;
  --ink:#1b1d19; --ink-soft:#5d6157; --ink-faint:#696b67;
  --line:#dcd7c9; --line-soft:#e7e3d8;
  --accent:#2d5c4d; --accent-ink:#1f4438; --accent-soft:#dfeae4;
  --warn:#9c5323; --warn-soft:#f2e4d6; --focus:#2d5c4d;
  --backdrop: rgba(20,22,19,.55);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  font-size:17px; line-height:1.6; min-height:100dvh;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
/* grana di carta, fissa e non cliccabile */
body::after{
  content:""; position:fixed; inset:0; z-index:60; pointer-events:none; opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
}
::selection{ background:var(--accent-soft); color:var(--ink); }

.serif{ font-family:Fraunces,"Iowan Old Style",Charter,Georgia,serif; }

/* ── impianto ──────────────────────────────────────────────────────────── */
.shell{ display:grid; grid-template-columns:320px 1fr; min-height:100dvh; }

.rail{
  border-right:1px solid var(--line); padding:40px 28px 28px; background:var(--paper-raised);
  display:flex; flex-direction:column; gap:26px; position:sticky; top:0; height:100dvh; overflow-y:auto;
}
.rail h1{
  font-family:Fraunces,Georgia,serif; font-size:23px; font-weight:600; line-height:1.2;
  letter-spacing:-.01em; margin:0 0 8px;
}
.rail .sub{ font-size:14.5px; color:var(--ink-soft); line-height:1.6; margin:0; }
.rail .sections{ display:flex; flex-direction:column; gap:1px; }
.rail .section-item{
  font-size:14.5px; font-weight:600; padding:11px 12px; border-radius:12px; color:var(--ink-soft);
  display:flex; justify-content:space-between; gap:10px; align-items:center; cursor:pointer;
  transition:background .4s var(--curva), color .4s var(--curva);
}
.rail .section-item:hover{ background:var(--line-soft); color:var(--ink); }
.rail .section-item.active{ background:var(--accent-soft); color:var(--accent-ink); }
.rail .section-item .n{ font-variant-numeric:tabular-nums; font-size:12.5px; font-weight:600; opacity:.75; }
.rail .section-sub{ display:flex; flex-direction:column; gap:1px; margin:4px 0 10px 12px; padding-left:14px; border-left:1px solid var(--line); }
.rail .section-subitem{
  font-size:13.5px; color:var(--ink-soft); padding:8px 10px; border-radius:10px;
  display:flex; align-items:flex-start; gap:9px; cursor:pointer; line-height:1.4;
  transition:background .4s var(--curva), color .4s var(--curva);
}
.rail .section-subitem:hover{ background:var(--line-soft); color:var(--ink); }
.rail .section-subitem.current{ color:var(--ink); font-weight:600; }
.rail .section-subitem .dot{ width:7px; height:7px; border-radius:50%; flex:none; margin-top:6px; background:var(--line); transition:background .4s var(--curva); }
.rail .section-subitem.done .dot{ background:var(--accent); }
.rail .section-subitem.skip .dot{ background:var(--warn); }

.main{ display:flex; flex-direction:column; min-height:100dvh; }

/* barra di avanzamento */
.topbar{ padding:28px 48px 0; display:flex; flex-direction:column; gap:12px; }
@media (max-width:900px){ .topbar{ padding:20px 20px 0; } }
.progress-line{ height:3px; background:var(--line); border-radius:99px; overflow:hidden; }
.progress-fill{ height:100%; background:var(--accent); border-radius:99px; width:0%; transition:width .7s var(--curva); }
.progress-meta{
  display:flex; justify-content:space-between; align-items:baseline; gap:16px;
  font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:600;
  color:var(--ink-faint); font-variant-numeric:tabular-nums;
}
.progress-meta b{ color:var(--ink-soft); }

/* barra mobile con indice */
.mobile-bar{ display:none; }
@media (max-width:900px){
  .shell{ grid-template-columns:1fr; }
  .rail{
    position:fixed; inset:0; z-index:80; display:none; height:100dvh; width:100%;
    border-right:none; padding:96px 22px 32px;
  }
  .rail.aperto{ display:flex; animation:entra .5s var(--curva) both; }
  .mobile-bar{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:14px 18px; border-bottom:1px solid var(--line); background:var(--paper-raised);
    position:sticky; top:0; z-index:90;
  }
  .mobile-bar .titolo{ font-family:Fraunces,Georgia,serif; font-size:15.5px; font-weight:600; line-height:1.25; }
  .mobile-bar .titolo span{ display:block; font-family:"Plus Jakarta Sans",system-ui,sans-serif; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); font-weight:700; }
  .mobile-bar button{ padding:10px 16px; font-size:13px; flex:none; }
  .topbar{ padding:14px 18px 0; }
  .progress-meta .conteggio{ display:none; }
  .progress-meta{ justify-content:flex-end; }
  body.con-striscia .mobile-bar{ top:0; }
  body.con-striscia .rail{ padding-top:150px; }
}
.sheet{
  position:fixed; inset:0; z-index:70; background:var(--backdrop);
  display:flex; align-items:flex-end; opacity:0; transition:opacity .5s var(--curva);
}
.sheet.aperto{ opacity:1; }
.sheet .sheet-panel{
  background:var(--paper-raised); width:100%; max-height:82dvh; overflow-y:auto;
  border-radius:28px 28px 0 0; padding:26px 22px 34px; border-top:1px solid var(--line);
  transform:translateY(24px); transition:transform .6s var(--curva);
}
.sheet.aperto .sheet-panel{ transform:translateY(0); }

/* ── la scheda: lastra dentro il vassoio ──────────────────────────────── */
.stage{ flex:1; display:flex; align-items:center; justify-content:center; padding:40px 48px 72px; }
@media (max-width:900px){ .stage{ padding:26px 18px 56px; align-items:flex-start; } }
.card{ width:100%; max-width:680px; }

.card-panel{
  background:var(--paper-raised); border:1px solid var(--line-soft); border-radius:24px;
  padding:44px 46px; margin:8px;
  box-shadow: 0 0 0 8px var(--paper-sunken), 0 0 0 9px var(--line), var(--ombra);
  animation:entra .8s var(--curva) both;
}
@media (max-width:600px){ .card-panel{ padding:26px 22px; border-radius:20px; margin:6px; box-shadow: 0 0 0 6px var(--paper-sunken), 0 0 0 7px var(--line), var(--ombra); } }
@keyframes entra{ from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce){ .card-panel{ animation:none; } }

.eyebrow{
  display:inline-block; font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;
  font-weight:700; color:var(--ink-faint); background:var(--paper-sunken);
  border:1px solid var(--line-soft); border-radius:99px; padding:5px 12px; margin:0 0 20px;
}
.question{
  font-family:Fraunces,"Iowan Old Style",Georgia,serif;
  font-size:clamp(27px,3.4vw,36px); line-height:1.18; letter-spacing:-.015em;
  margin:0 0 16px; text-wrap:balance; font-weight:600;
}
.hint{ font-size:16px; color:var(--ink-soft); margin:0 0 26px; line-height:1.65; max-width:56ch; }

.status-chip{
  display:inline-flex; align-items:center; gap:7px; font-size:12px; padding:6px 13px;
  border-radius:99px; margin:0 0 18px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
}
.status-chip.draft{ background:var(--accent-soft); color:var(--accent-ink); }
.status-chip.missing{ background:var(--warn-soft); color:var(--warn); }
.status-chip.confirmed{ background:var(--accent-soft); color:var(--accent-ink); }
.status-chip::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }

textarea{
  width:100%; min-height:170px; padding:18px 20px; font-size:16.5px; line-height:1.65;
  font-family:Fraunces,"Iowan Old Style",Georgia,serif; font-weight:400; color:var(--ink);
  background:var(--paper); border:1px solid var(--line); border-radius:16px;
  resize:vertical; outline:none;
  transition:border-color .4s var(--curva), box-shadow .4s var(--curva), background .4s var(--curva);
}
textarea:focus{ border-color:var(--focus); box-shadow:0 0 0 4px var(--accent-soft); background:var(--paper-raised); }
textarea::placeholder{ color:var(--ink-faint); font-family:"Plus Jakarta Sans",system-ui,sans-serif; font-size:15.5px; }

.critical-note{
  display:flex; gap:11px; align-items:flex-start; margin-top:16px; padding:15px 17px;
  background:var(--warn-soft); border-radius:14px; font-size:14px; color:var(--warn); line-height:1.55;
}

/* ── pulsanti ─────────────────────────────────────────────────────────── */
.actions{ display:flex; justify-content:space-between; align-items:center; gap:16px; margin-top:34px; flex-wrap:wrap; }
.actions .left{ display:flex; gap:6px; flex-wrap:wrap; }
button{
  font-family:inherit; font-size:15px; font-weight:600; letter-spacing:-.01em;
  padding:13px 22px; border-radius:99px; border:1px solid transparent; cursor:pointer;
  display:inline-flex; align-items:center; gap:10px;
  transition:background .45s var(--curva), color .45s var(--curva), border-color .45s var(--curva), transform .25s var(--curva), box-shadow .45s var(--curva);
}
button:active{ transform:scale(.975); }
button:focus-visible{ outline:2px solid var(--focus); outline-offset:3px; }
button.primary{ background:var(--accent); color:var(--paper-raised); padding-right:7px; box-shadow:var(--ombra); }
button.primary:hover{ background:var(--accent-ink); box-shadow:var(--ombra-alta); }
button.primary .pallino{
  width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.16);
  display:inline-flex; align-items:center; justify-content:center; flex:none;
  transition:transform .45s var(--curva), background .45s var(--curva);
}
button.primary:hover .pallino{ transform:translateX(3px) scale(1.06); background:rgba(255,255,255,.24); }
button.primary .pallino svg{ width:14px; height:14px; }
button.ghost{ background:transparent; color:var(--ink-soft); border-color:var(--line); }
button.ghost:hover{ color:var(--ink); border-color:var(--ink-faint); background:var(--line-soft); }
button.text{ background:transparent; color:var(--ink-faint); padding:13px 10px; }
button.text:hover{ color:var(--ink-soft); }

/* ── riepilogo ────────────────────────────────────────────────────────── */
.center-screen{ text-align:center; }
.center-screen .question{ font-size:clamp(26px,3vw,32px); }
.center-screen .hint{ margin-left:auto; margin-right:auto; }

.recap-list{ text-align:left; margin:26px 0 6px; display:flex; flex-direction:column; }
.recap-row{ display:grid; grid-template-columns:1fr auto; gap:18px; padding:18px 0; border-bottom:1px solid var(--line-soft); align-items:start; }
.recap-row:last-child{ border-bottom:none; }
.recap-row .rk{ font-size:13px; color:var(--ink-faint); line-height:1.45; font-weight:600; }
.recap-row .rv{ font-family:Fraunces,Georgia,serif; font-size:16.5px; line-height:1.6; margin-top:6px; }
.recap-row .rv.skip{ color:var(--ink-faint); font-style:italic; font-size:15px; }
.recap-row .redit{
  font-size:13.5px; font-weight:700; color:var(--accent); background:none; border:none;
  cursor:pointer; padding:4px 0; white-space:nowrap;
}
.recap-row .redit:hover{ color:var(--accent-ink); }

/* ── cancello email ───────────────────────────────────────────────────── */
.gate input{
  width:100%; padding:16px 18px; font-size:16.5px; margin-bottom:8px; font-family:inherit; color:var(--ink);
  background:var(--paper); border:1px solid var(--line); border-radius:16px; outline:none;
  transition:border-color .4s var(--curva), box-shadow .4s var(--curva);
}
.gate input:focus{ border-color:var(--focus); box-shadow:0 0 0 4px var(--accent-soft); }
.gate-error{ color:var(--warn); font-size:14.5px; margin:4px 0 16px; min-height:1.3em; text-align:left; }

.striscia-anteprima{
  position:fixed; top:0; left:0; right:0; z-index:55; text-align:center;
  background:var(--warn-soft); color:var(--warn); border-bottom:1px solid rgba(156,83,35,.35);
  font-size:12.5px; font-weight:700; letter-spacing:.04em; padding:10px 16px;
}
body.con-striscia{ padding-top:40px; }
@media (max-width:600px){ .striscia-anteprima{ font-size:11.5px; padding:8px 14px; } body.con-striscia{ padding-top:56px; } }
.login-team{
  position:fixed; top:20px; right:24px; z-index:20; font-size:13px; font-weight:700;
  letter-spacing:.04em; text-decoration:none; color:var(--ink-soft);
  border:1px solid var(--line); border-radius:99px; padding:9px 18px; background:var(--paper-raised);
  transition:color .4s var(--curva), border-color .4s var(--curva), box-shadow .4s var(--curva);
}
.login-team:hover{ color:var(--accent-ink); border-color:var(--accent); box-shadow:var(--ombra); }

.modal-backdrop{ position:fixed; inset:0; background:var(--backdrop); display:flex; align-items:center; justify-content:center; padding:24px; z-index:70; }
.modal-panel{
  background:var(--paper-raised); border:1px solid var(--line-soft); border-radius:24px;
  padding:40px 38px; max-width:520px; text-align:center;
  box-shadow: 0 0 0 8px var(--paper-sunken), 0 0 0 9px var(--line), var(--ombra-alta);
  animation:entra .7s var(--curva) both;
}
.modal-panel .question{ font-size:26px; }

.footer-privacy{ font-size:12px; color:var(--ink-faint); line-height:1.6; padding-top:20px; border-top:1px solid var(--line-soft); margin-top:auto; }
.footer-privacy a{ color:var(--ink-soft); }
.footer-privacy p{ margin:0 0 10px; }
.footer-piva{ margin-top:10px !important; }
.info-privacy{ margin:2px 0 12px; }
.info-privacy summary{
  cursor:pointer; color:var(--ink-soft); font-weight:600; list-style:none; font-size:12px;
  text-decoration:underline; text-underline-offset:2px;
}
.info-privacy summary::-webkit-details-marker{ display:none; }
.info-privacy-corpo{
  margin-top:10px; padding:14px 16px; background:var(--paper-sunken); border:1px solid var(--line-soft);
  border-radius:14px; font-size:12px; line-height:1.6;
}
.info-privacy-corpo b{ color:var(--ink-soft); font-weight:700; }
.info-privacy-corpo p{ margin:0 0 10px; }
.info-privacy-corpo p:last-child{ margin-bottom:0; }

/* ── selettore settori Sales Navigator ────────────────────────────────── */
.sn-wrap{ margin-top:18px; }
.sn-toolbar{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.sn-search{
  flex:1; min-width:220px; padding:12px 16px; border:1px solid var(--line); border-radius:99px;
  font:inherit; font-size:15px; background:var(--paper); color:var(--ink); outline:none;
  transition:border-color .4s var(--curva), box-shadow .4s var(--curva);
}
.sn-search:focus{ border-color:var(--focus); box-shadow:0 0 0 4px var(--accent-soft); }
.sn-count{ font-size:13px; color:var(--ink-faint); white-space:nowrap; font-variant-numeric:tabular-nums; }
.sn-count b{ color:var(--ink); font-weight:700; }
.sn-clear{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font:inherit; font-size:13px; padding:0; }
.sn-clear:hover{ color:var(--warn); }
.sn-groups{
  border:1px solid var(--line); border-radius:20px; max-height:52vh; overflow-y:auto;
  background:var(--paper); box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.sn-group{ border-bottom:1px solid var(--line-soft); }
.sn-group:last-child{ border-bottom:none; }
.sn-group-head{ display:flex; align-items:center; gap:12px; padding:14px 18px; cursor:pointer; user-select:none; transition:background .4s var(--curva); }
.sn-group-head:hover{ background:var(--line-soft); }
.sn-caret{
  width:9px; height:9px; border-right:1.5px solid var(--ink-faint); border-bottom:1.5px solid var(--ink-faint);
  transform:rotate(-45deg); transition:transform .45s var(--curva); flex:none; margin-left:2px;
}
.sn-group.open>.sn-group-head .sn-caret{ transform:rotate(45deg); }
.sn-group-name{ flex:1; font-weight:600; font-size:14.5px; }
.sn-badge{ font-size:11.5px; font-weight:700; color:var(--ink-faint); background:var(--paper-sunken); border:1px solid var(--line-soft); border-radius:99px; padding:3px 10px; font-variant-numeric:tabular-nums; }
.sn-badge.on{ background:var(--accent); color:var(--paper-raised); border-color:transparent; }
.sn-group-body{ display:none; padding:4px 18px 16px 32px; }
.sn-group.open>.sn-group-body{ display:block; }
.sn-sub{ margin:12px 0 6px; }
.sn-sub-head{ display:flex; align-items:center; gap:10px; font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.14em; font-weight:700; margin-bottom:8px; }
.sn-sub-all{ background:none; border:none; color:var(--accent); cursor:pointer; font:inherit; font-size:11.5px; font-weight:700; padding:0; text-transform:none; letter-spacing:0; }
.sn-item{ display:flex; align-items:flex-start; gap:10px; padding:6px 0; font-size:14.5px; cursor:pointer; line-height:1.45; }
.sn-item:hover{ color:var(--accent-ink); }
.sn-item input{ margin-top:4px; flex:none; width:16px; height:16px; accent-color:var(--accent); }
.sn-empty{ padding:20px; color:var(--ink-faint); font-size:14px; }
.sn-chosen{ margin-top:16px; display:flex; flex-wrap:wrap; gap:7px; }
.sn-chip{
  background:var(--accent-soft); color:var(--accent-ink); border-radius:99px; padding:6px 12px;
  font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:8px;
}
.sn-chip button{ background:none; border:none; cursor:pointer; color:inherit; opacity:.6; font-size:15px; line-height:1; padding:0; }
.sn-chip button:hover{ opacity:1; }

/* ── elenco link ──────────────────────────────────────────────────────── */
.lk-row{ display:flex; gap:10px; margin-bottom:10px; }
.lk-row input{
  flex:1; padding:12px 16px; border:1px solid var(--line); border-radius:14px; font:inherit;
  font-size:15px; background:var(--paper); color:var(--ink); outline:none;
  transition:border-color .4s var(--curva), box-shadow .4s var(--curva);
}

function saveLocal(){
  if (ANTEPRIMA) { state.updatedAt = Date.now(); return; }
  state.updatedAt = Date.now();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
  syncRemote();
  pushFirestore();
}

function pushFirestore(){
  if (!fbDb) return;
  if (state.stage === 'gate' || state.stage === 'intro') return;
  try {
    fbDb.collection('onboarding_wizard').doc(CLIENT_SLUG).set({
      cliente: CLIENT_NAME,
      slug: CLIENT_SLUG,
      stato_json: JSON.stringify(state),
      updatedAt: state.updatedAt,
    }, { merge: true }).catch(() => {});
  } catch(e) {}
}

let applyingRemote = false;
function pullFirestore(){
  if (ANTEPRIMA) return Promise.resolve();
  if (!fbDb) return Promise.resolve();
  return fbDb.collection('onboarding_wizard').doc(CLIENT_SLUG).get().then((snap) => {
    if (!snap.exists) return;
    const remote = snap.data();
    if (!remote.stato_json) return;
    const remoteState = JSON.parse(remote.stato_json);
    if ((remoteState.updatedAt || 0) > (state.updatedAt || 0)) {
      const localStage = state.stage;
      state = Object.assign(state, remoteState);
      if (localStage === 'gate' || localStage === 'intro') state.stage = localStage;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
      renderAll();
    }
  }).catch(() => {});
}

function watchFirestore(){
  if (ANTEPRIMA) return;
  if (!fbDb) return;
  fbDb.collection('onboarding_wizard').doc(CLIENT_SLUG).onSnapshot((snap) => {
    if (!snap.exists) return;
    const activeIsTextarea = document.activeElement && document.activeElement.id === 'answerBox';
    if (activeIsTextarea) return;
    const remote = snap.data();
    if (!remote.stato_json) return;
    const remoteState = JSON.parse(remote.stato_json);
    if ((remoteState.updatedAt || 0) > (state.updatedAt || 0)) {
      const localStage = state.stage;
      state = Object.assign(state, remoteState);
      if (localStage === 'gate' || localStage === 'intro') state.stage = localStage;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
      renderAll();
    }
  }, () => {});
}

function syncRemote(){
  if (state.stage === 'gate' || state.stage === 'intro') return;
  try {
    const payload = {
      timestamp: new Date().toISOString(),
      cliente: CLIENT_NAME,
      slug: CLIENT_SLUG,
      email: GATE_EMAIL,
      stato: state.submitted ? 'completato' : 'in_corso',
      risposte_json: JSON.stringify(
        ALL.reduce((acc, q) => {
          const v = state.answers[q.id] !== undefined ? state.answers[q.id] : q.draft;
          acc[q.id] = v || '';
          return acc;
        }, {})
      ),
    };
    fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).catch(() => {});
  } catch(e) {}
}

function statusChip(q){
  if (state.answers[q.id] !== undefined) {
    if (state.skipped[q.id]) return `<span class="status-chip missing">Saltata</span>`;
    return `<span class="status-chip confirmed">Confermata</span>`;
  }
  if (q.draft) return `<span class="status-chip draft">Bozza nostra da verificare</span>`;
  return `<span class="status-chip missing">Da compilare</span>`;
}

function bindSettori(q, value){
  const dati = window.SN_SETTORI || [];
  let scelti = new Set((value||'').split(';').map(s=>s.trim()).filter(Boolean));
  const groupsEl = document.getElementById('snGroups');
  const chosenEl = document.getElementById('snChosen');
  const nEl = document.getElementById('snN');
  const searchEl = document.getElementById('snSearch');
  const aperti = new Set();

  function vociDi(g){
    if (g.voci) return g.voci;
    return g.sottogruppi.reduce((a,s)=>a.concat(s.voci), []);
  }
  function filtra(q2){
    if (!q2) return dati;
    const t = q2.toLowerCase();
    return dati.map(g => {
      if (g.voci) {
        const v = g.voci.filter(x => x.toLowerCase().includes(t));
        return v.length ? { gruppo:g.gruppo, voci:v } : null;
      }
      const sg = g.sottogruppi.map(s => {
        const v = s.voci.filter(x => x.toLowerCase().includes(t));
        return v.length ? { nome:s.nome, voci:v } : null;
      }).filter(Boolean);
      return sg.length ? { gruppo:g.gruppo, sottogruppi:sg } : null;
    }).filter(Boolean);
  }
  function itemHtml(v){
    const on = scelti.has(v);
    return `<label class="sn-item"><input type="checkbox" data-v="${v.replace(/"/g,'&quot;')}" ${on?'checked':''}/><span>${v}</span></label>`;
  }
  function render(){
    const term = (searchEl.value||'').trim();
    const lista = filtra(term);
    if (!lista.length) { groupsEl.innerHTML = `<div class="sn-empty">Nessun settore trovato per "${term}".</div>`; return; }
    groupsEl.innerHTML = lista.map(g => {
      const tutte = vociDi(g);
      const nSel = tutte.filter(v => scelti.has(v)).length;
      const open = term || aperti.has(g.gruppo);
      const corpo = g.voci
        ? g.voci.map(itemHtml).join('')
        : g.sottogruppi.map(s => `
            <div class="sn-sub">
              <div class="sn-sub-head"><span>${s.nome}</span><button type="button" class="sn-sub-all" data-all="${s.voci.join('||').replace(/"/g,'&quot;')}">seleziona tutti</button></div>
              ${s.voci.map(itemHtml).join('')}
            </div>`).join('');
      return `<div class="sn-group ${open?'open':''}" data-g="${g.gruppo.replace(/"/g,'&quot;')}">
        <div class="sn-group-head"><span class="sn-caret"></span><span class="sn-group-name">${g.gruppo}</span>
          <span class="sn-badge ${nSel?'on':''}">${nSel?nSel+' su '+tutte.length:tutte.length}</span></div>
        <div class="sn-group-body">${corpo}</div>
      </div>`;
    }).join('');
    groupsEl.querySelectorAll('.sn-group-head').forEach(h => {
      h.onclick = () => {
        const g = h.parentElement.dataset.g;
        if (aperti.has(g)) aperti.delete(g); else aperti.add(g);
        h.parentElement.classList.toggle('open');
      };
    });
    groupsEl.querySelectorAll('.sn-item input').forEach(cb => {
      cb.onchange = () => { cb.checked ? scelti.add(cb.dataset.v) : scelti.delete(cb.dataset.v); sync(); };
    });
    groupsEl.querySelectorAll('.sn-sub-all').forEach(b => {
      b.onclick = (ev) => {
        ev.stopPropagation();
        b.dataset.all.split('||').forEach(v => scelti.add(v));
        sync();
      };
    });
  }
  function sync(){
    nEl.textContent = scelti.size;
    chosenEl.innerHTML = [...scelti].map(v => `<span class="sn-chip">${v}<button type="button" data-x="${v.replace(/"/g,'&quot;')}">×</button></span>`).join('');
    chosenEl.querySelectorAll('button').forEach(b => { b.onclick = () => { scelti.delete(b.dataset.x); render(); sync(); }; });
    render();
  }
  searchEl.oninput = render;
  document.getElementById('snClear').onclick = () => { scelti.clear(); sync(); };
  sync();
  return () => [...scelti].join('; ');
}

function renderLinks(q, value){
  const righe = (value||'').split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
  if (!righe.length) righe.push('');
  return `<div class="sn-wrap" id="lkWrap">
    ${righe.map(v => `<div class="lk-row"><input type="url" value="${v.replace(/"/g,'&quot;')}" placeholder="https://..." /><button type="button" class="lk-del" title="Togli">×</button></div>`).join('')}
    <button type="button" class="lk-add" id="lkAdd">+ aggiungi un altro link</button>
  </div>`;
}

function bindLinks(){
  const wrap = document.getElementById('lkWrap');
  function bindDel(){
    wrap.querySelectorAll('.lk-del').forEach(b => {
      b.onclick = () => {
        if (wrap.querySelectorAll('.lk-row').length > 1) b.parentElement.remove();
        else b.parentElement.querySelector('input').value = '';
      };
    });
  }
  document.getElementById('lkAdd').onclick = () => {
    const row = document.createElement('div');
    row.className = 'lk-row';
    row.innerHTML = '<input type="url" placeholder="https://..." /><button type="button" class="lk-del" title="Togli">×</button>';
    wrap.insertBefore(row, document.getElementById('lkAdd'));
    bindDel();
    row.querySelector('input').focus();
  };
  bindDel();
  return () => [...wrap.querySelectorAll('input')].map(i => i.value.trim()).filter(Boolean).join(', ');
}


function renderScelta(q, value){
  const sel = (value||'').trim();
  return `<div class="sn-wrap">
    ${(q.opzioni||[]).map(o => `
      <label class="sc-opt ${sel===o.v?'on':''}">
        <input type="radio" name="scelta_${q.id}" value="${o.v.replace(/"/g,'&quot;')}" ${sel===o.v?'checked':''}/>
        <span class="sc-txt"><b>${o.v}</b><span>${o.d||''}</span></span>
      </label>`).join('')}
  </div>`;
}

function bindScelta(q){
  const wrap = document.querySelectorAll(`input[name="scelta_${q.id}"]`);
  wrap.forEach(r => { r.onchange = () => {
    document.querySelectorAll('.sc-opt').forEach(l => l.classList.remove('on'));
    if (r.checked) r.closest('.sc-opt').classList.add('on');
  };});
  return () => { const c = [...wrap].find(r => r.checked); return c ? c.value : ''; };
}

function renderQuestion(){
  const q = ALL[state.i];
  const existing = state.answers[q.id];
  const value = existing !== undefined ? existing : q.draft;
  const campo = q.type === 'settori' ? renderSettori(q, value)
              : q.type === 'links' ? renderLinks(q, value)
              : q.type === 'scelta' ? renderScelta(q, value)
              : `<textarea id="answerBox" placeholder="Scrivi qui la risposta...">${(value||'').replace(/</g,'&lt;')}</textarea>`;
  const html = `
    <div class="card-panel">
      <p class="eyebrow">${q.sectionTitle}</p>
      ${statusChip(q)}
      <h2 class="question">${q.text}</h2>
      ${q.hint ? `<p class="hint" style="margin:0 0 4px;">${q.hint}</p>` : ''}
      ${q.nota ? `<div class="nota-box"><b>Perch\u00e9 te lo chiediamo</b>${q.nota}</div>` : ''}
      ${campo}
      ${q.critical ? `<div class="critical-note">⚠ ${q.criticalNote}</div>` : ''}
      <div class="actions">
        <div class="left">
          ${state.i > 0 && !state.returnToRecap ? `<button class="ghost" id="backBtn">Torna indietro</button>` : ''}
          <button class="text" id="skipBtn">Salta questa domanda</button>
        </div>
        <button class="primary" id="nextBtn">${state.returnToRecap ? 'Salva e torna al riepilogo' : (state.i === ALL.length - 1 ? 'Vai al riepilogo' : 'Conferma e continua')}</button>
      </div>
    </div>
  `;
  renderShell(html);
  const leggiValore = q.type === 'settori' ? bindSettori(q, value)
                    : q.type === 'links' ? bindLinks()
                    : q.type === 'scelta' ? bindScelta(q)
                    : () => document.getElementById('answerBox').value.trim();
  document.getElementById('nextBtn').onclick = () => {
    const val = leggiValore().trim();
    state.answers[q.id] = val;
    state.skipped[q.id] = val === '';
    advance();
  };
  document.getElementById('skipBtn').onclick = () => {
    state.answers[q.id] = '';
    state.skipped[q.id] = true;
    advance();
  };
  const backBtn = document.getElementById('backBtn');
  if (backBtn) backBtn.onclick = () => { state.i--; saveLocal(); renderAll(); };
}

function advance(){
  if (state.returnToRecap) {
    state.returnToRecap = false;
    state.stage = 'recap';
  } else if (state.i < ALL.length - 1) {
    state.i++;
  } else {
    state.stage = 'recap';
  }
  saveLocal();
  renderAll();
}

function editFromRecap(index){
  state.i = index;
  state.returnToRecap = true;
  state.stage = 'question';
  saveLocal();
  renderAll();
}

function buildRecapRows(){
  return ALL.map((q, idx) => {
    const v = state.answers[q.id] !== undefined ? state.answers[q.id] : q.draft;
    const skip = state.answers[q.id] !== undefined ? state.skipped[q.id] : (!q.draft);
    return `<div class="recap-row">
      <div>
        <div class="rk">${q.text}</div>
        <div class="rv ${skip ? 'skip' : ''}">${skip ? '(nessuna risposta)' : (v||'').replace(/</g,'&lt;')}</div>
      </div>
      <button class="redit" data-idx="${idx}">Modifica</button>
    </div>`;
  }).join('');
}

function renderRecap(){
  const rows = buildRecapRows();
  const html = `
    <div class="card-panel center-screen">
      <p class="eyebrow">Ultimo passo</p>
      <h2 class="question">Rivedi le tue risposte</h2>
      <p class="hint" style="margin:0 auto;">Rileggi con calma e cambia quello che vuoi: da qui si torna su ogni domanda. Quando confermi partiamo a costruire liste e messaggi, e ti apriamo la dashboard dove segui i risultati.</p>
      <div class="recap-list">${rows}</div>
      <button class="primary" id="confirmBtn" style="width:100%;">Confermo, è tutto corretto</button>
    </div>
  `;
  renderShell(html);
  document.querySelectorAll('.redit').forEach(btn => {
    btn.onclick = () => editFromRecap(parseInt(btn.dataset.idx, 10));
  });
  document.getElementById('confirmBtn').onclick = submitFinal;
}

function submitFinal(){
  if (ANTEPRIMA) {
    alert("Questa è l'anteprima del questionario: serve a vedere com'è fatto, non si può inviare.");
    return;
  }
  state.submitted = true;
  state.stage = 'thanks';
  saveLocal();
  renderAll();
}

function renderThanks(){
  const rows = buildRecapRows();
  const html = `
    <div class="card-panel center-screen">
      <p class="eyebrow">Fatto</p>
      <h2 class="question">Grazie, ${CLIENT_NAME.split(' ')[0]}</h2>
      <p class="hint" style="margin:0 auto;">Da qui in poi tocca a noi: prepariamo le liste e i primi messaggi e ti scriviamo appena sono pronti da approvare. Se ti viene in mente altro, torna qui e modifica: le tue risposte restano sempre aperte.</p>
      <div class="recap-list" style="text-align:left;">${rows}</div>
    </div>
  `;
  renderShell(html);
  document.querySelectorAll('.redit').forEach(btn => {
    btn.onclick = () => editFromRecap(parseInt(btn.dataset.idx, 10));
  });
}

// Ogni pulsante principale prende la sua freccia dentro il cerchio, come da sistema visivo.
function abbellisciBottoni(){
  document.querySelectorAll('button.primary').forEach(b => {
    if (b.querySelector('.pallino')) return;
    const c = document.createElement('span');
    c.className = 'pallino';
    c.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5"/></svg>';
    b.appendChild(c);
  });
}

function renderAll(){
  if (state.stage === 'gate') { renderGate(); abbellisciBottoni(); return; }
  if (state.stage === 'intro') { renderIntro(); abbellisciBottoni(); return; }
  if (state.stage === 'recap') { renderRecap(); abbellisciBottoni(); return; }
  if (state.stage === 'thanks') { renderThanks(); abbellisciBottoni(); return; }
  renderQuestion();
  abbellisciBottoni();
}

// Pagina unica: con ?c=<slug> carica cliente, email e bozze da Firestore, cosi' un cliente
// nuovo e' online nell'istante in cui viene creato, senza pubblicare nessun file.
function caricaClienteDaId(){
  const id = new URLSearchParams(location.search).get('c');
  if (!id || !IS_TEMPLATE) return Promise.resolve();
  const url = 'https://firestore.googleapis.com/v1/projects/dc-outreach-dashboard/databases/(default)/documents/onboarding_wizard/' + encodeURIComponent(id);
  return fetch(url).then(r => r.ok ? r.json() : null).then(doc => {
    if (!doc) return;
    const f = doc.fields || {};
    CLIENT_SLUG = id;
    CLIENT_NAME = (f.cliente && f.cliente.stringValue) || id;
    GATE_EMAIL = ((f.email && f.email.stringValue) || '').toLowerCase();
    STORAGE_KEY = 'dcacademy_onboarding_' + CLIENT_SLUG;
    IS_TEMPLATE = false;
    const bozze = (f.bozze && f.bozze.mapValue && f.bozze.mapValue.fields) || {};
    SECTIONS.forEach(sec => sec.questions.forEach(q => {
      const v = bozze[q.id] && bozze[q.id].stringValue;
      if (v) q.draft = v;
    }));
    document.title = 'Onboarding · ' + CLIENT_NAME;
  }).catch(() => {});
}

caricaClienteDaId().then(avviaPagina);

function avviaPagina(){
loadLocal();
if (ANTEPRIMA) {
  state.stage = 'intro';
  // in anteprima non c'e' nessun cliente: mostrare "[NOME CLIENTE]" nella barra laterale
  // fa sembrare la pagina rotta a chi la apre dal pannello.
  CLIENT_NAME = "anteprima";
  document.title = "Anteprima del questionario · DC Academy";
  const striscia = document.createElement('div');
  striscia.className = 'striscia-anteprima';
  striscia.textContent = "Anteprima del questionario · niente viene salvato e non si può inviare";
  document.body.appendChild(striscia);
  document.body.classList.add('con-striscia');
}
renderAll();
pullFirestore().then(() => { watchFirestore(); });
}

window.addEventListener('storage', (ev) => {
  if (ev.key !== STORAGE_KEY || !ev.newValue) return;
  const activeIsTextarea = document.activeElement && document.activeElement.id === 'answerBox';
  if (activeIsTextarea) return;
  loadLocal();
  renderAll();
});
</script>
